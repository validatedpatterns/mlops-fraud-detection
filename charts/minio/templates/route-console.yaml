apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: minio
    component: minio
  name: minio-console
spec:
  port:
    targetPort: console
  tls:
    insecureEdgeTerminationPolicy: Allow
    termination: edge
  to:
    kind: Service
    name: minio
    weight: 100
  wildcardPolicy: None
